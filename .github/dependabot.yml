version: 2
updates:
  # Main workspace (pnpm lockfile + workspace package.json files)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # TypeScript majors are taken by hand. Nothing here depends on the
      # TypeScript *JS API* any more (the classic-concat loader was the last
      # consumer and now uses rspack's bundled swc plus acorn), so `typescript`
      # is devDependencies-only: it builds this repo and its .d.ts output and
      # is never shipped to consumers. TypeScript 7 already removed the JS API
      # entirely; a future major could just as easily change what `tsc` and
      # declaration emit do, so a human should confirm the build and the
      # generated declarations before it lands.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # TanStack Table 9 is a ground-up API rewrite (createCoreRowModel,
      # tableFeatures) and the devtools log-table is written against the v8
      # hook API, so the major must land together with that migration. The
      # 9.0.0 bump (#502) broke the release build and was reverted.
      - dependency-name: "@tanstack/react-table"
        update-types:
          - "version-update:semver-major"
      # The Solid pass in programs/develop runs babel-preset-solid, which
      # declares a peer range of @babel/core ^7, and @babel/preset-typescript 8
      # dropped the isTSX and allExtensions options that pass sets. The Babel 8
      # majors (#684, #685) therefore break every Solid build, and they cannot
      # land one at a time either, since core 8 refuses to load a 7.x preset.
      # Take them by hand once the Solid preset ships a release that accepts
      # Babel 8.
      - dependency-name: "@babel/core"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@babel/preset-typescript"
        update-types:
          - "version-update:semver-major"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    labels:
      - "dependencies"

  # GitHub Actions used by the workflows (version + SHA updates)
  # The npm the release job installs is lockfile-pinned here, so bumps must
  # arrive as PRs like every other dependency.
  - package-ecosystem: "npm"
    directory: "/.github/tools/npm"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    labels:
      - "dependencies"

  # Composite actions are not covered by the "/" entry above, so the pins in
  # .github/actions/setup/action.yml are scanned on their own.
  - package-ecosystem: "github-actions"
    directory: "/.github/actions/setup"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    labels:
      - "dependencies"

