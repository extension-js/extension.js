# One-off workflow to retroactively clean past GitHub release bodies.
# Removes release-machinery lines from release notes, in both subject styles.
#
# Trigger: workflow_dispatch
# Or: gh workflow run clean-release-notes.yml
name: Clean release notes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      # gh release edit rewrites release bodies
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Clean release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/clean-release-notes.mjs
