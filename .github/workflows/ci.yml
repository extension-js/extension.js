name: 🛠

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/FUNDING.yml'
      - '.github/CODE_OF_CONDUCT.md'
      - '.github/SECURITY.md'
      - 'LICENSE'
  # Pull requests run CI on every change, docs included, so the required
  # CI passed check always reports and a docs-only PR is never stuck waiting.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a pull request run, but every run of main finishes
# so its red lane report names the commit that broke it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Static gates read source, so no `pnpm compile` is needed. The bundler
      # erases type-only imports, so only the typecheck sees a broken one.
      - name: Lint
        run: pnpm lint

      # House rule: no em dashes in source, comments, or docs.
      - name: Check prose
        run: pnpm check:prose

      # The messaging standard: line prefixes, brand spelling, ellipsis, and
      # the imperative voice of every command description. Pure Node over
      # string literals, so it needs no build. See docs/MESSAGING.md.
      - name: Check messaging standard
        run: pnpm check:messaging

      # Runtime code ships inside the add-on a developer submits, so an
      # innerHTML write there earns every one of them an AMO store warning.
      - name: Check runtime HTML assignment
        run: pnpm check:runtime-html

      # TypeScript honors @ts-nocheck in a line comment only, so the block form
      # reads as an exemption and silently checks the file anyway.
      - name: Check for dead @ts-nocheck directives
        run: pnpm check:ts-nocheck

      - name: Typecheck
        run: pnpm typecheck

      # Every spec under scripts/__spec__, pure Node and git with no build.
      - name: Run the script specs
        run: pnpm test:scripts

      # The bundled template must match the templates repo at the pinned commit,
      # so a pin move or a bundled edit that drifts fails here, not at release.
      - name: Check bundled create template drift
        run: bash scripts/check-bundled-template-drift.sh

  tests:
    # Every event runs each suite once, on the engines floor. Newer Node runs
    # on main and nightly, where a break is caught before a release.
    name: Run test suite (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite:
          - ci:test:develop
          - ci:test:cli
          - ci:test:create

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install xvfb (cli suite)
        # The suite needs only a display, no browser. The image carries Xvfb,
        # so apt is reached only when it is missing and an outage stays green.
        if: matrix.suite == 'ci:test:cli'
        timeout-minutes: 5
        run: |
          if command -v Xvfb >/dev/null 2>&1; then
            echo "Xvfb is on the runner image, nothing to install"
            exit 0
          fi
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends xvfb

      - name: Start Xvfb (cli suite)
        if: matrix.suite == 'ci:test:cli'
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.suite }}
        run: pnpm run ${{ matrix.suite }}

  tests-node:
    # Current Node, for an API that changed after the floor. Pull requests skip
    # it, so it runs on main here and every night in programs-nightly.yml.
    name: Node ${{ matrix.node }} (${{ matrix.suite }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: [24]
        suite:
          - ci:test:develop
          - ci:test:cli
          - ci:test:create

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install xvfb (cli suite)
        if: matrix.suite == 'ci:test:cli'
        timeout-minutes: 5
        run: |
          if command -v Xvfb >/dev/null 2>&1; then
            echo "Xvfb is on the runner image, nothing to install"
            exit 0
          fi
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends xvfb

      - name: Start Xvfb (cli suite)
        if: matrix.suite == 'ci:test:cli'
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.suite }}
        run: pnpm run ${{ matrix.suite }}

  smoke-npx:
    name: Packed-tarball smoke (npx)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Installs the freshly packed extension/create/develop/install tarballs
      # into a clean temp project and runs --help + a template build. This is
      # the only lane that exercises the PUBLISHED-package context: a missing
      # runtime dependency keeps every workspace suite green and only fails
      # here.
      - name: Run packed-tarball smoke
        run: pnpm smoke:npx

      # The typecheck reads workspace packages from source, so only this reads
      # the declarations the smoke above just compiled for all four packages.
      - name: Check the emitted declarations
        run: node scripts/check-emitted-types.mjs

      # Dry-run packs each package the smoke above compiled and fails on an
      # exports, main, types or bin entry whose file is not in the tarball.
      - name: Check every manifest entry is in its tarball
        run: pnpm check:packed-exports

  bundled-extensions:
    name: Bundled extensions build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile CLI and develop pipeline
        run: |
          pnpm --filter extension-develop compile
          pnpm --filter extension compile

      # A dependency bump in extensions/ can break one engine only, and the
      # release builds all four. The script also checks its own build stamp.
      - name: Build bundled extensions for every engine
        run: node scripts/build-extensions.cjs

  deno-runtime:
    name: Deno runtime (${{ matrix.deno }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The floor the entry guard enforces, and the current release. 2.8.0 is
        # deliberately absent: it cannot resolve node:querystring from inside
        # the bundler, so the guard refuses that one release by name. Windows
        # carries current only: the floor is about Deno's own capability and
        # does not vary by platform, while binary resolution and the dev
        # teardown very much do, and those are what Windows is here to cover.
        include:
          - os: ubuntu-latest
            deno: 'v2.5.0'
          - os: ubuntu-latest
            deno: 'v2.x'
          - os: windows-latest
            deno: 'v2.x'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ matrix.deno }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile CLI and develop pipeline
        run: |
          pnpm --filter extension-develop compile
          pnpm --filter extension compile

      # The deno lane in optional-deps-matrix.yml runs `deno install` and then
      # reaches the CLI through its Node shebang, so it proves nothing about
      # Deno executing the toolchain. This is the only lane that does, and it
      # covers dev as well as build because they load different module graphs.
      - name: Run the Deno runtime smoke
        run: pnpm smoke:deno

  bun-runtime:
    name: Bun runtime (${{ matrix.bun }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The floor the entry guard enforces, and the current release. Below
        # 1.2 Bun cannot load the rspack native binding, and 1.1.38 reaches it
        # and then dies inside napi. Windows carries current only, for the same
        # reason the Deno lane does: the floor is a Bun capability question,
        # Windows is a spawn and teardown question.
        include:
          - os: ubuntu-latest
            bun: '1.2.0'
          - os: ubuntu-latest
            bun: 'latest'
          - os: windows-latest
            bun: 'latest'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile CLI and develop pipeline
        run: |
          pnpm --filter extension-develop compile
          pnpm --filter extension compile

      # The bun lane in optional-deps-matrix.yml installs with Bun and then
      # reaches the CLI through its Node shebang, so it never executes the
      # toolchain on Bun. This is the only lane that does, and it covers dev as
      # well as build because they load different module graphs.
      - name: Run the Bun runtime smoke
        run: pnpm smoke:bun

  # The Windows suites run as parallel jobs, so the slowest one sets the wait
  # instead of the sum. The develop suite is the longest, so it runs as two
  # vitest shards.
  tests-windows-develop:
    name: Run test suite (Windows, develop ${{ matrix.shard }}/2)
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile the build engine and what it depends on
        run: pnpm exec turbo run compile --filter ./programs/develop

      - name: Run this half of the develop suite
        run: pnpm -C programs/develop exec vitest run --shard=${{ matrix.shard }}/2

  tests-windows-cli:
    name: Run test suite (Windows, CLI, install and create)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile the CLI
        run: pnpm --filter extension compile

      - name: Prove the system Edge is found with an empty managed cache
        run: node scripts/verify-edge-system-locate.mjs

      - name: Run the CLI and install suites
        run: pnpm test:cli

      - name: Run the create suite
        run: pnpm ci:test:create

  ci-passed:
    # The one check branch protection requires. It waits on every CI job and
    # passes only when each one succeeded or was skipped.
    name: CI passed
    if: always()
    needs:
      - quality
      - tests
      - tests-node
      - smoke-npx
      - bundled-extensions
      - deno-runtime
      - bun-runtime
      - tests-windows-develop
      - tests-windows-cli
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # report-red-lane.sh opens or comments on the red lane issue
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the result of every CI job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: bash scripts/check-ci-results.sh "${RESULTS}"

      - name: Report a red lane
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RED_LANE_REPRO: |
            pnpm install --frozen-lockfile
            pnpm test
        run: bash scripts/report-red-lane.sh "CI"

      - name: Close the red lane
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/close-red-lane.sh "CI"
