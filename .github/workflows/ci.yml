name: 🛠

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/FUNDING.yml'
      - '.github/CODE_OF_CONDUCT.md'
      - '.github/SECURITY.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/FUNDING.yml'
      - '.github/CODE_OF_CONDUCT.md'
      - '.github/SECURITY.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Static gates run against source, no `pnpm compile` needed. Both were
      # previously unenforced in CI: biome lint had no workflow, and there was
      # no `typecheck` script at all. Adding the typecheck gate immediately
      # caught two `import type {DevOptions} from './types'` paths in
      # plugin-css that resolved to a nonexistent module (the bundler erases
      # type-only imports, so the build survived while the type silently
      # degraded to `any`).
      - name: Lint
        run: pnpm lint

      # House rule: no em dashes in source, comments, or docs.
      - name: Check prose
        run: pnpm check:prose

      # The messaging standard: line prefixes, brand spelling, ellipsis, and
      # the imperative voice of every command description. Pure Node over
      # string literals, so it needs no build. See docs/MESSAGING.md.
      - name: Check messaging standard
        run: pnpm check:messaging

      - name: Typecheck
        run: pnpm typecheck

      # Release-notes generator is pure Node + git; no build needed.
      - name: Test release-notes generator
        run: pnpm test:scripts

      # The bundled javascript template is synced from extension-js/examples,
      # and publish-release.yml gates every release on it being in sync. That
      # gate lived ONLY at release time and nightly, so a push to the examples
      # repo could redden a release hours later with no warning, which is what
      # killed the 4.0.24 attempt on 2026-07-30 twenty one seconds in. Running
      # it here surfaces the drift on the push that causes it instead of at the
      # moment somebody is trying to ship. The release gate stays as a backstop.
      - name: Check bundled create template drift
        run: bash scripts/check-bundled-template-drift.sh

  tests:
    name: Run test suite (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - ci:test:develop
          - ci:test:cli
          - ci:test:create
          - ci:test:plugin-extension
          - ci:test:browser
          - ci:test:plugin-compilation
          - ci:test:plugin-css
          - ci:test:plugin-js-frameworks
          - ci:test:plugin-compatibility
          - ci:test:plugin-static-assets
          - ci:test:toolchain-preflight
          - ci:test:core

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install xvfb (cli suite)
        # ci:test:cli is a vitest unit-test suite; it does not need real
        # browser binaries. Previously this step also `apt-get install`ed
        # firefox + chromium and exported their paths into env vars,
        # but nothing in the repo reads those env vars (`grep -rn
        # EXTENSION_TEST_GECKO_BINARY`/EXTENSION_TEST_CHROMIUM_BINARY
        # finds zero consumers). On Ubuntu 24.04 (noble), `apt-get
        # install firefox` triggers a snap transitional shim that hangs
        # 30+20 minutes on snap-store contact and aborts the job. We
        # only need xvfb for any headed display the tests touch.
        if: matrix.suite == 'ci:test:cli'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Start Xvfb (cli suite)
        if: matrix.suite == 'ci:test:cli'
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.suite }}
        run: pnpm run ${{ matrix.suite }}

  smoke-npx:
    name: Packed-tarball smoke (npx)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Installs the freshly packed extension/create/develop/install tarballs
      # into a clean temp project and runs --help + a template build. This is
      # the only lane that exercises the PUBLISHED-package context: a missing
      # runtime dependency keeps every workspace suite green and only fails
      # here.
      - name: Run packed-tarball smoke
        run: pnpm smoke:npx

  bundled-extensions:
    name: Bundled extensions build (chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile CLI and develop pipeline
        run: |
          pnpm --filter extension-develop compile
          pnpm --filter extension compile

      # The bundled devtools/theme extensions are otherwise only built by
      # publish-release.yml and the nightly, so a breaking dependency bump
      # in extensions/ merges green here and reddens the next release
      # (the react-table 9 bump did exactly that). One engine is enough to
      # catch API breaks; the release gate still builds all four.
      - name: Build bundled extensions for chromium
        run: |
          pnpm --filter extension-js-devtools run build:chromium
          pnpm --filter @extension-js/theme run build:chromium

  tests-windows:
    name: Run test suite (Windows)
    runs-on: windows-latest
    # Only run Windows tests on PRs and main, skip on workflow_dispatch unless explicitly needed
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full test suite
        run: pnpm test
