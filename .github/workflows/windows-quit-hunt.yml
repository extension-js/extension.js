name: CI – Windows quit time hunt

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: 'How many times to run the interrupt teardown spec'
        required: false
        default: '50'

permissions:
  contents: read

jobs:
  hunt:
    name: Loop the interrupt teardown spec on Windows
    timeout-minutes: 90
    runs-on: windows-latest
    env:
      ROUNDS: ${{ inputs.rounds }}
      EXTENSION_QUIT_TIMES_FILE: ${{ github.workspace }}/quit-times.txt
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile every package the CLI loads
        run: pnpm compile

      # PowerShell, like the CI job: under Git Bash the console interrupt
      # the spec sends never reaches the CLI.
      - name: Loop the spec
        working-directory: programs/extension
        run: |
          $failed = 0
          foreach ($round in 1..[int]$env:ROUNDS) {
            Write-Host "::group::round $round"
            node ../../scripts/run-vitest.mjs __spec__/exec/browser-teardown-on-interrupt.contract.spec.ts
            if ($LASTEXITCODE -ne 0) {
              $failed++
              Write-Host "round $round failed"
            }
            Write-Host "::endgroup::"
          }
          Write-Host "failed rounds: $failed of $env:ROUNDS"
          "FAILED_ROUNDS=$failed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          exit 0

      - name: Print the quit times
        if: always()
        shell: bash
        run: |
          file=quit-times.txt
          if [ ! -f "$file" ]; then
            echo "no quit was recorded"
            exit 1
          fi
          echo "quits: $(wc -l < "$file")"
          echo "slowest twenty (command browser ms):"
          sort -k3 -n -r "$file" | head -20
          echo "by bucket:"
          awk '{b = int($3 / 500) * 500; n[b]++} END {for (b in n) print b, n[b]}' "$file" | sort -n
          echo "at or past 4500 ms: $(awk '$3 >= 4500' "$file" | wc -l)"

      - name: Fail when a round failed
        if: env.FAILED_ROUNDS != '0'
        shell: bash
        run: exit 1
