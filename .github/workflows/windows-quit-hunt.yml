name: CI – Windows quit time hunt

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: 'How many times to run the edge dev smoke'
        required: false
        default: '40'

permissions:
  contents: read

jobs:
  hunt:
    name: Loop the edge dev smoke
    timeout-minutes: 90
    runs-on: ubuntu-22.04
    env:
      ROUNDS: ${{ inputs.rounds }}
      EXTENSION_AUTHOR_MODE: development
      EXTENSION_FORCE_KILL_MS: '12000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node-version: '22'
      - name: Compile
        run: pnpm compile
      - name: Hydrate templates from examples repo
        run: bash scripts/hydrate-templates-from-examples.sh
      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium
      - name: Loop
        run: |
          CHROMIUM_BIN="$(node -e 'import("@playwright/test").then((m) => console.log(m.chromium.executablePath()))')"
          pnpm extension build templates/typescript --browser edge --silent true
          failed=0
          for round in $(seq 1 "$ROUNDS"); do
            rm -rf "$HOME/.config/chromium" "$HOME/.config/microsoft-edge" "$HOME/.cache/chromium"
            if xvfb-run -a node scripts/nightly-dev-smoke.mjs templates/typescript --browser edge --chromium-binary "$CHROMIUM_BIN" --profile false --no-open --port 0 > "round-$round.log" 2>&1; then
              echo "round $round ok"
            else
              failed=$((failed + 1))
              echo "::group::round $round FAILED"
              tail -60 "round-$round.log"
              echo "::endgroup::"
            fi
          done
          echo "failed rounds: $failed of $ROUNDS"
