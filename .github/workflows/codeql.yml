name: CodeQL

# OpenSSF Scorecard only credits the SAST check when a workflow file in this
# repo runs github/codeql-action, so CodeQL is set up here as an "advanced
# setup" instead of GitHub's default setup, which is invisible to Scorecard.
# Do not re-enable default setup in the repo settings: while it is on, GitHub
# rejects the SARIF uploads this workflow produces and analysis stops.
#
# The matrix mirrors what default setup ran (javascript-typescript plus
# actions, default query suite, weekly schedule) and keeps the same
# "/language:<name>" categories so the existing alert history carries over.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '15 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      # Upload the SARIF to code scanning
      security-events: write
      # Fetch private CodeQL packs, harmless on a public repo
      packages: read
      # Required by the action to read workflow run metadata
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Leaving "queries" unset selects the default suite, the same one default
      # setup used. Set "queries: security-extended" to widen the coverage.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"

  # Each analysis of main saves a new overlay base of about 350 MB and pull
  # requests restore only the newest, so the older ones are removed here.
  prune-overlay-caches:
    name: Keep one CodeQL overlay base
    needs: analyze
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # gh cache delete
      actions: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Delete older overlay bases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prune-codeql-overlay-caches.mjs
