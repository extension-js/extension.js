name: CI – Optional Deps Matrix

on:
  pull_request:
    paths:
      - 'programs/**'
      - 'extensions/browser-extension/**'
      - 'extensions/monorepo/**'
      - 'scripts/**'
      - '.github/workflows/optional-deps-matrix.yml'
      - '.github/workflows/publish-release.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches:
      - main
    paths:
      - 'programs/**'
      - 'extensions/browser-extension/**'
      - 'extensions/monorepo/**'
      - 'scripts/**'
      - '.github/workflows/optional-deps-matrix.yml'
      - '.github/workflows/publish-release.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: optional-deps-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  optional-deps-lib-specs:
    name: toolchain preflight specs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run toolchain preflight specs
        run: pnpm run ci:test:toolchain-preflight

  optional-deps-smoke:
    name: smoke (${{ matrix.os }} / ${{ matrix.pm }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pm: pnpm
          - os: ubuntu-latest
            pm: npm
          - os: ubuntu-latest
            pm: yarn
          - os: ubuntu-latest
            pm: bun
          - os: ubuntu-latest
            pm: deno
          - os: macos-latest
            pm: pnpm
          - os: macos-latest
            pm: deno
          - os: windows-latest
            pm: pnpm
          - os: windows-latest
            pm: npm
          # Fork/engine build-target lanes. `build` only emits artifacts (no
          # browser is launched), so these assert the Chromium/Gecko family
          # routing + dist-target contract without the fork binary installed.
          - os: ubuntu-latest
            pm: pnpm
            browser: brave
          - os: ubuntu-latest
            pm: pnpm
            browser: waterfox

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable corepack for Yarn
        if: matrix.pm == 'yarn'
        run: corepack enable

      - name: Setup Bun
        if: matrix.pm == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Setup Deno
        if: matrix.pm == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Test optional deps smoke helpers
        run: node --test scripts/__spec__/run-optional-deps-smoke.spec.mjs

      # Matrix values reach the shell through env, so the run line stays plain
      # shell that workflow linters and Scorecard can parse.
      - name: Run optional deps smoke
        # bash on every OS: the Windows default shell is PowerShell, which does
        # not expand the parameter syntax below.
        shell: bash
        env:
          SMOKE_PM: ${{ matrix.pm }}
          SMOKE_BROWSER: ${{ matrix.browser }}
        run: node scripts/run-optional-deps-smoke.mjs --pm "$SMOKE_PM" ${SMOKE_BROWSER:+--browser "$SMOKE_BROWSER"}

      - name: Compile local Extension.js packages for workspace first-dev check
        if: matrix.os == 'windows-latest' && matrix.pm == 'npm'
        run: pnpm --dir programs/create run compile && pnpm --dir programs/develop run compile && pnpm --dir programs/extension run compile

      - name: Verify first dev content-react contract (Windows npm)
        if: matrix.os == 'windows-latest' && matrix.pm == 'npm'
        run: node scripts/verify-content-template-first-dev.mjs --templates content-react --use-default-cache --use-workspace-package
