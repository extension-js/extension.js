name: Sync npm README

# README.md is the source. programs/extension/README.md is the copy npm shows,
# with a few badges swapped. A README change on main regenerates the copy and
# pushes it straight to main through the release deploy key, the only actor the
# main ruleset lets past its pull request rule.

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'scripts/sync-npm-readme.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-npm-readme
  cancel-in-progress: false

jobs:
  sync:
    name: Sync the npm README copy
    runs-on: ubuntu-latest
    # The key is an environment secret of the release environments, whose
    # branch policy only admits main.
    environment: next
    env:
      HUSKY: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      # Node built-ins only: no install, so no dependency code runs in this job.
      - name: Regenerate the copy
        id: sync
        run: |
          node scripts/sync-npm-readme.mjs
          if git diff --quiet -- programs/extension/README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add programs/extension/README.md
          git commit --no-verify -m "Sync the npm README copy with README.md"

      # The key reaches only this step, which runs the push script and nothing else.
      - name: Push to main
        if: steps.sync.outputs.changed == 'true'
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: bash scripts/push-release-refs.sh "HEAD:refs/heads/main"
