name: CI – E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  e2e:
    name: Run E2E Tests
    # 120, not the old 60: a fully green suite measures roughly 75 minutes
    # (55m chromium, 10m firefox, 8m setup), so the old budget guaranteed the
    # nightly could never pass regardless of product health. The inner 105m
    # test budget below is what keeps a wedged night red instead of cancelled.
    timeout-minutes: 120
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          node-version: '22'

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw-version.outputs.version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pw-${{ runner.os }}-${{ steps.pw-version.outputs.version }}-

      - name: Compile Extension.js
        run: pnpm compile

      # Fail fast if the CLI the suite builds with is missing or cannot boot.
      # Every template build spawns this exact bin (scripts/
      # build-with-manifest.mjs), and the cross-template specs receive it via
      # EXTENSION_LOCAL_CLI_CJS below. When it was silently absent, the suite
      # burned the whole job budget on ENOENT timeouts, so prove it answers
      # here, in seconds, before any test spends minutes waiting on it.
      - name: Assert the compiled CLI answers
        run: node programs/extension/bin/extension.cjs --version

      - name: Hydrate templates from examples repo
        run: bash scripts/hydrate-templates-from-examples.sh

      - name: Install Playwright browsers
        # See `nightly-firefox` in programs-nightly.yml: hold the firefox
        # apt package so `--with-deps` doesn't try to upgrade it into the
        # snap transitional shim that hangs on snap-store contact for
        # ~50 minutes on GitHub-hosted Ubuntu 24.04 runners.
        run: |
          sudo apt-mark hold firefox
          npx playwright install --with-deps

      # This step used to have no budget of its own, so a suite that never
      # finished was killed by the JOB and GitHub recorded `cancelled`.
      # Nothing counts a cancellation as red, so this workflow reported
      # "no evidence" instead of "broken" every night from 2026-05-03 to
      # 2026-08-01. The inner 105m budget is what makes the light able to
      # turn red: 105m + the ~8m setup above leaves time inside the 120m job
      # budget for the report upload and the post steps, and a slow night
      # now ends as a FAILING step that names the spec it was on.
      #
      # SIGINT, not the default SIGTERM: Playwright treats an interrupt as a
      # graceful stop and flushes its reporters. Verified against a deliberately
      # hanging spec: the list reporter prints the running test and a
      # `1 interrupted` summary naming it, and the html/json report is still
      # written for the upload step below. --kill-after is the backstop for a
      # run so wedged it cannot even shut down.
      #
      # `timeout` sits INSIDE xvfb-run on purpose. Without --foreground it puts
      # the command in its own process group and signals the whole group, so
      # pnpm, the playwright runner and every browser it spawned all get the
      # interrupt; the other nesting would only signal the xvfb-run wrapper and
      # leave the runner alive under a dead parent.
      - name: Run E2E Tests (headed under Xvfb)
        run: |
          xvfb-run -a timeout --signal=INT --kill-after=2m 105m pnpm test:e2e || {
            code=$?
            if [ "$code" = "124" ] || [ "$code" = "137" ]; then
              echo "::error::the e2e suite hit the 105m inner timeout. The last test named by the list reporter above is where it wedged. Live processes:"
              ps auxww | grep -E "chrome|chromium|firefox|Xvfb|playwright|node" | grep -v grep || true
            fi
            exit "$code"
          }
        env:
          PLAYWRIGHT_HEADLESS: '0'
          # The eight cross-template specs (dev, reload, create, multi-browser,
          # the four content-reload variants) resolve the CLI through this
          # variable and fall back to `pnpm extension dev` with cwd set to the
          # template directory, where no such script exists. Nothing in this
          # repo ever set it, so every one of those specs died in beforeAll
          # after waiting the full 90s for a CDP port that was never going to
          # be printed. Point them at the CLI this job just compiled.
          EXTENSION_LOCAL_CLI_CJS: ${{ github.workspace }}/programs/extension/bin/extension.cjs

      - name: Upload Test Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: e2e-report/
          retention-days: 15
